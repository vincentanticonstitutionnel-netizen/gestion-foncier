<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foncier — suivi parcellaire</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --paper:#f2f3f0; --panel:#ffffff; --ink:#16191a; --muted:#6b7270;
  --rule:#d8dbd6; --rule-soft:#e8eae6; --accent:#1f5f4f; --accent-soft:#e4efe9;
  --danger:#a3302a; --warn:#9a6b12;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --h-top:46px; --h-bot:44px; --w-left:250px; --w-right:300px;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#15181a;--panel:#1c2022;--ink:#e6e9e6;--muted:#9aa19d;--rule:#31373a;--rule-soft:#262b2d;--accent:#63b598;--accent-soft:#1d3a33;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--paper);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
button{background:transparent;border:1px solid var(--rule);border-radius:5px;padding:5px 9px;cursor:pointer}
button:hover{background:var(--rule-soft)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.1)}
button.on{background:var(--accent-soft);border-color:var(--accent)}
button.ic{padding:4px 6px;line-height:0}
button.danger{color:var(--danger);border-color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:5px 7px;width:100%}
label{display:block;font-size:11px;color:var(--muted);margin:7px 0 2px}
.mono{font-family:var(--mono)}
.row{display:flex;gap:6px;align-items:center}
.grow{flex:1;min-width:0}
.hide{display:none !important}

#top{height:var(--h-top);display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--rule)}
#top .brand{font-weight:600;letter-spacing:.02em;white-space:nowrap}
#top .brand small{font-weight:400;color:var(--muted);margin-left:6px;font-size:11px}
#q{max-width:250px}
#syncState{font-size:11px;color:var(--muted);white-space:nowrap}

#main{position:absolute;top:var(--h-top);bottom:var(--h-bot);left:0;right:0;display:flex}
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0;transition:width .15s}
#left{width:var(--w-left);border-right:1px solid var(--rule)}
#right{width:var(--w-right);border-left:1px solid var(--rule);overflow-y:auto;padding:10px}
#left.replie,#right.replie{width:0;border:0;overflow:hidden;padding:0}
#map{flex:1;min-width:0;background:var(--paper)}

.tabs{display:flex;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;border:0;border-radius:0;border-bottom:2px solid transparent;padding:8px 0;font-size:12px;color:var(--muted)}
.tabs button.ontab{color:var(--accent);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:5px;padding:6px;border-bottom:1px solid var(--rule-soft);align-items:center}
.toolbar select{padding:3px 5px;font-size:11px}
.list{flex:1;overflow-y:auto;user-select:none}
.item{display:flex;gap:7px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--rule-soft);cursor:pointer}
.item:hover{background:var(--rule-soft)}
.item.sel{background:var(--accent-soft)}
.item.primaire{box-shadow:inset 3px 0 0 var(--accent)}
.item .sw{width:10px;height:10px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.25)}
.item .id{font-family:var(--mono);font-size:12px}
.item .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ar{font-size:11px;color:var(--muted);white-space:nowrap}
.item input[type=checkbox]{width:auto;margin:0;flex:none}

#bot{position:absolute;bottom:0;left:0;right:0;height:var(--h-bot);display:flex;align-items:center;background:var(--panel);border-top:1px solid var(--rule);padding:0 10px;gap:16px;overflow-x:auto}
.stat b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.stat span{font-size:10px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 7px;font-size:11px}
.kv{width:100%;border-collapse:collapse}
.kv td{padding:3px 0;vertical-align:top}
.kv td:first-child{color:var(--muted);width:46%}
.kv td:last-child{text-align:right}
.warnflag{color:var(--warn);font-size:11px}
h3{font-size:13px;margin:0 0 6px;font-weight:600}
.sect{border-top:1px solid var(--rule-soft);margin-top:10px;padding-top:8px}
.chk{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:12px}
.chk input{width:auto;margin:0}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:2000}
.modal{background:var(--panel);border-radius:8px;max-width:900px;width:100%;max-height:90vh;display:flex;flex-direction:column}
.modal header{padding:11px 14px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px}
.modal header h2{margin:0;font-size:14px;flex:1}
.modal .body{padding:14px;overflow:auto}
.modal footer{padding:10px 14px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;align-items:center}
table.grid{width:100%;border-collapse:collapse;font-size:12px}
table.grid th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;border-bottom:1px solid var(--rule);padding:4px}
table.grid td{border-bottom:1px solid var(--rule-soft);padding:2px 4px}
table.grid input,table.grid select{padding:2px 4px;font-size:12px;border-color:transparent;background:transparent}
table.grid input:hover,table.grid select:hover{border-color:var(--rule)}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.bad{color:var(--danger)}
.ok{color:var(--accent)}
.leaflet-container{background:var(--paper);font-family:var(--sans)}
.leaflet-container.ajout{cursor:crosshair}
.plabel{font-family:var(--mono);font-size:10px;color:#fff;text-shadow:0 0 2px #000,0 0 3px #000;white-space:nowrap}
.legend{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:5px 7px;font-size:11px;line-height:1.7;max-width:190px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
#motifs{position:absolute;width:0;height:0;overflow:hidden}

#drawer{display:none}
@media (max-width:860px){
  :root{--w-left:0px;--w-right:0px}
  #left,#right{position:absolute;top:0;bottom:0;z-index:1200;width:82%;max-width:330px;box-shadow:0 0 22px rgba(0,0,0,.3)}
  #left{left:0;transform:translateX(-102%);transition:transform .18s}
  #right{right:0;transform:translateX(102%);transition:transform .18s}
  #left.replie,#right.replie{width:82%;padding:10px}
  #right.replie{padding:10px}
  #left.open,#right.open{transform:none}
  #drawer{display:inline-flex}
  #tLeft,#tRight{display:none}
  #q{max-width:none}
}
</style>
</head>
<body>

<div id="top">
  <button id="drawer" class="ic" title="Liste">☰</button>
  <button id="tLeft" class="ic" title="Replier la liste">◧</button>
  <div class="brand">Foncier<small id="expName"></small></div>
  <input id="q" placeholder="Rechercher : A 145, Peyrères, Dupont…" autocomplete="off">
  <span class="grow"></span>
  <span id="syncState">local</span>
  <button id="btnImport">Importer</button>
  <button id="btnExport">Exporter</button>
  <button id="btnParams">Paramètres</button>
  <button id="tRight" class="ic" title="Replier la fiche">◨</button>
</div>

<div id="main">
  <aside id="left">
    <div class="tabs">
      <button data-tab="parcelles" class="ontab">Parcelles</button>
      <button data-tab="baux">Baux</button>
    </div>
    <div class="toolbar" id="tbParcelles">
      <select id="fCommune"><option value="">Toutes communes</option></select>
      <select id="fStatut"><option value="">Tout statut</option></select>
      <button id="btnMulti" class="ic" title="Mode sélection multiple (cases à cocher)">☑</button>
    </div>
    <div class="toolbar hide" id="tbBaux">
      <button id="btnNewBail">Nouveau bail</button>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div id="map"><svg id="motifs" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <aside id="right"><div id="fiche"></div></aside>
</div>

<div id="bot">
  <div class="stat"><b id="sSurf">—</b><span>surface cadastrale</span></div>
  <div class="stat"><b id="sNb">—</b><span>parcelles</span></div>
  <div class="stat"><b id="sProp">—</b><span>en propriété</span></div>
  <div class="stat"><b id="sEch">—</b><span>échéance &lt; 2 ans</span></div>
  <div class="stat"><b id="sGeo">—</b><span>sans contour</span></div>
  <span class="grow"></span>
  <button id="btnAjout">Ajouter au clic</button>
  <button id="btnGeo">Où suis-je ?</button>
  <button id="btnFetchGeo">Récupérer les contours</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

const VERSION = "0.3.1";

/* ------------------------------------------------------------------ *
 * Identifiant client Google
 * Public par nature : c'est l'origine JavaScript autorisée qui protège.
 * Le champ des paramètres, s'il est rempli, prend le pas sur cette valeur.
 * ------------------------------------------------------------------ */
const CLIENT_ID_DEFAUT = "508014726863-68iau9lce9vbvjhqpo6tn0niss1e0ma6.apps.googleusercontent.com";
const clientId = () => (DB.settings.clientId || "").trim() || CLIENT_ID_DEFAUT;

/* ------------------------------------------------------------------ *
 * Constantes métier
 * ------------------------------------------------------------------ */

const STATUTS = {
  propriete:{l:"Propriété",         c:"#2e7d4f"},
  fermage:  {l:"Fermage écrit",     c:"#2b6ca8"},
  verbal:   {l:"Bail verbal",       c:"#c98a1e"},
  metayage: {l:"Métayage",          c:"#b8567f"},
  cpp:      {l:"Convention pluriannuelle", c:"#8a6d3b"},
  pret:     {l:"Prêt à usage",      c:"#7a5cb8"},
  mad:      {l:"Mise à disposition", c:"#4a8a8a"},
  inconnu:  {l:"À qualifier",       c:"#8b918e"}
};

const NATURES = {
  T:"Terre", P:"Pré", PN:"Pré naturel", PP:"Prairie permanente", H:"Herbage",
  L:"Lande", LB:"Lande boisée", B:"Bois", BT:"Bois taillis", BF:"Bois futaie",
  BM:"Bois mêlé", BR:"Bois résineux", S:"Sol", J:"Jardin", VE:"Verger",
  VI:"Vigne", PE:"Peupleraie", CA:"Carrière", E:"Eau", AG:"Terrain d'agrément",
  CH:"Chemin", AB:"Arbres"
};
const NAT_COLORS = ["#4d8b5c","#7a9a3f","#b08a3e","#5f8fa8","#8d6fae","#a86a5c","#6f8f8f","#9a7f4f","#5e7f6f","#8f6f8f"];

const FV_STATUT = { D:"propriete", F:"fermage", M:"metayage" };

/* Panachages superposables aux couleurs de fond */
const MOTIFS = {
  hachures:   {l:"Hachures",   svg:(id,c)=>`<pattern id="${id}" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><rect width="9" height="9" fill="none"/><line x1="0" y1="0" x2="0" y2="9" stroke="${c}" stroke-width="3"/></pattern>`},
  croisillons:{l:"Croisillons",svg:(id,c)=>`<pattern id="${id}" patternUnits="userSpaceOnUse" width="10" height="10"><line x1="0" y1="0" x2="0" y2="10" stroke="${c}" stroke-width="2"/><line x1="0" y1="0" x2="10" y2="0" stroke="${c}" stroke-width="2"/></pattern>`},
  points:     {l:"Points",     svg:(id,c)=>`<pattern id="${id}" patternUnits="userSpaceOnUse" width="9" height="9"><circle cx="4.5" cy="4.5" r="2" fill="${c}"/></pattern>`},
  bandes:     {l:"Bandes",     svg:(id,c)=>`<pattern id="${id}" patternUnits="userSpaceOnUse" width="12" height="12"><rect width="5" height="12" fill="${c}"/></pattern>`}
};

const IGN = "https://data.geopf.fr";
const APICARTO = "https://apicarto.ign.fr/api/cadastre/parcelle";
const GEOAPI = "https://geo.api.gouv.fr/communes";
const SCOPE = "https://www.googleapis.com/auth/drive.file";

const ICO_POUBELLE = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4.5h6V7"/></svg>';

/* ------------------------------------------------------------------ *
 * Stockage local (IndexedDB)
 * ------------------------------------------------------------------ */

function idb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("foncier",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("kv");
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function kvGet(k){
  const d = await idb();
  return new Promise((res,rej)=>{
    const t = d.transaction("kv").objectStore("kv").get(k);
    t.onsuccess = ()=> res(t.result); t.onerror = ()=> rej(t.error);
  });
}
async function kvSet(k,v){
  const d = await idb();
  return new Promise((res,rej)=>{
    const t = d.transaction("kv","readwrite").objectStore("kv").put(v,k);
    t.onsuccess = ()=> res(); t.onerror = ()=> rej(t.error);
  });
}

/* ------------------------------------------------------------------ *
 * État
 * ------------------------------------------------------------------ */

function emptyDB(){
  return {
    version:1, updatedAt:null,
    exploitation:{nom:""},
    communes:[], proprietaires:[], baux:[], parcelles:[], ilots:[], projets:[],
    settings:{clientId:"", rpgLayer:"LANDUSE.AGRICULTURE2024"}
  };
}

let DB = emptyDB();
let GEO = {};
let selection = new Set();   // toutes les parcelles sélectionnées
let sel = null;              // la dernière cliquée : celle dont la fiche s'affiche
let ancre = null;            // pour la sélection par plage (Maj+clic)
let tab = "parcelles";
let colorMode = "statut";
let modeMulti = false;       // cases à cocher, pour le tactile
let modeAjout = false;       // ajout de parcelle au clic sur la carte
let dirty = false;

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ------------------------------------------------------------------ *
 * Utilitaires
 * ------------------------------------------------------------------ */

const uid = p => p + Math.random().toString(36).slice(2,9);
const pad = (v,n) => String(v==null?"":v).trim().padStart(n,"0");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function idParcelle(insee, prefixe, section, numero){
  return pad(insee,5) + pad(prefixe||"000",3) + pad(section,2).toUpperCase() + pad(numero,4);
}
function ha(m2){
  if(m2==null || isNaN(m2) || !m2) return "—";
  return (m2/10000).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " ha";
}
function haca(m2){
  if(m2==null||isNaN(m2)||!m2) return "—";
  const h = Math.floor(m2/10000), a = Math.floor((m2%10000)/100), c = Math.round(m2%100);
  return `${h} ha ${pad(a,2)} a ${pad(c,2)} ca`;
}
function toast(msg, bad){
  let t = $("#toast");
  if(!t){
    t = document.createElement("div"); t.id="toast";
    t.style.cssText="position:fixed;bottom:56px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 14px;z-index:3000;box-shadow:0 3px 14px rgba(0,0,0,.2);max-width:90%";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.borderColor = bad ? "var(--danger)" : "var(--rule)";
  t.style.display = "block";
  clearTimeout(t._t); t._t = setTimeout(()=>{t.style.display="none";}, bad?6000:3600);
}
function communeNom(insee){
  const c = DB.communes.find(c=>c.insee===insee);
  return c ? c.nom : insee;
}
function proprio(id){ return DB.proprietaires.find(p=>p.id===id) || null; }
function bail(id){ return DB.baux.find(b=>b.id===id) || null; }
function parcelle(id){ return DB.parcelles.find(p=>p.id===id) || null; }
function projet(id){ return (DB.projets||[]).find(p=>p.id===id) || null; }

function statutDe(p){
  const b = p.bailId ? bail(p.bailId) : null;
  return (b && b.statut) || p.statut || "inconnu";
}
function bailleurDe(p){
  const b = p.bailId ? bail(p.bailId) : null;
  const pr = proprio(b ? b.proprietaireId : p.proprietaireId);
  return pr ? pr.nom : (statutDe(p)==="propriete" ? "En propriété" : "Non renseigné");
}
function echeanceDe(p){
  const b = p.bailId ? bail(p.bailId) : null;
  return b && b.echeance ? b.echeance : null;
}
function contenance(p){ return Number(p.contenance) || 0; }
function natureDe(p){ return (p.natures && p.natures[0]) || ""; }
function naturesLabel(p){
  if(!p.natures || !p.natures.length) return "—";
  return p.natures.map(natureLabel).join(", ");
}
function natureLabel(code){ return NATURES[code] || code || "—"; }

function hashColor(str, palette){
  let h = 0;
  for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  return palette[h % palette.length];
}
function couleurDe(p){
  if(colorMode==="statut") return STATUTS[statutDe(p)] ? STATUTS[statutDe(p)].c : STATUTS.inconnu.c;
  if(colorMode==="bailleur") return hashColor(bailleurDe(p), NAT_COLORS);
  if(colorMode==="nature") return natureDe(p) ? hashColor(natureDe(p), NAT_COLORS) : "#8b918e";
  const e = echeanceDe(p);
  if(!e) return "#8b918e";
  const dans = e - new Date().getFullYear();
  return dans <= 2 ? "#c0392b" : (dans <= 5 ? "#c98a1e" : "#2e7d4f");
}
function legendeItems(){
  let base;
  if(colorMode==="statut"){
    const used = new Set(DB.parcelles.map(statutDe));
    base = [...used].map(k=>({c:STATUTS[k]?STATUTS[k].c:"#888", l:STATUTS[k]?STATUTS[k].l:k}));
  } else if(colorMode==="bailleur"){
    const used = new Set(DB.parcelles.map(bailleurDe));
    base = [...used].map(n=>({c:hashColor(n,NAT_COLORS), l:n}));
  } else if(colorMode==="nature"){
    const used = new Set(DB.parcelles.map(natureDe).filter(Boolean));
    base = [...used].map(n=>({c:hashColor(n,NAT_COLORS), l:natureLabel(n)}));
  } else {
    base = [{c:"#c0392b",l:"moins de 2 ans"},{c:"#c98a1e",l:"2 à 5 ans"},{c:"#2e7d4f",l:"plus de 5 ans"},{c:"#8b918e",l:"sans échéance"}];
  }
  const proj = (DB.projets||[]).filter(pr=> DB.parcelles.some(p=>(p.projets||[]).includes(pr.id)))
    .map(pr=>({c:pr.couleur, l:pr.nom, motif:pr.motif}));
  return {base, proj};
}

/* ------------------------------------------------------------------ *
 * Recherche parcellaire
 * ------------------------------------------------------------------ */

function normalise(s){
  return String(s==null?"":s).toUpperCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");
}
const sansZeros = s => String(s||"").replace(/^0+/,"") || "0";

/* Trois régimes : référence parcellaire, section seule, texte libre.
   « A 002 » et « A 2 » désignent tous deux la parcelle A 0002, jamais la A 0021. */
function correspond(p, q){
  const brut = String(q==null?"":q).trim();
  if(!brut) return true;
  const n = normalise(brut);
  if(!n) return true;
  const sec = sansZeros(p.section);

  /* « A 145 », « a145 », « 145 » : section facultative, numéro exact */
  const m = brut.toUpperCase().match(/^\s*([A-Z]{1,2})?\s*(\d{1,4})\s*$/);
  if(m){
    const qs = m[1] ? sansZeros(m[1].padStart(2,"0")) : null;
    return (!qs || qs === sec) && pad(m[2],4) === p.numero;
  }

  /* « ZB », « A » : toute une section */
  if(/^[A-Z]{1,2}$/.test(n)) return sec === sansZeros(n.padStart(2,"0"));

  /* identifiant cadastral complet ou partiel : « 0A0115 », « 314400000A0115 » */
  if(/^[0-9A-Z]{5,14}$/.test(n) && normalise(p.id).includes(n)) return true;

  /* texte libre */
  const txt = normalise([p.lieuDit, bailleurDe(p), communeNom(p.insee), naturesLabel(p), p.notes,
    (p.projets||[]).map(id=>{ const pr = projet(id); return pr?pr.nom:""; }).join(" ")].join(" "));
  return n.length >= 2 && txt.includes(n);
}

/* ------------------------------------------------------------------ *
 * Carte
 * ------------------------------------------------------------------ */

let map, coucheParcelles, legende, marqueurPos;
const couches = {};

function wmts(layer, fmt){
  return `${IGN}/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&LAYER=${layer}&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=${encodeURIComponent(fmt)}`;
}

function initMap(){

  couches.plan  = L.tileLayer(wmts("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2","image/png"),{maxZoom:19,maxNativeZoom:19,attribution:"IGN-F / Géoplateforme"});
  couches.ortho = L.tileLayer(wmts("ORTHOIMAGERY.ORTHOPHOTOS","image/jpeg"),{maxZoom:20,maxNativeZoom:19,attribution:"IGN-F / Géoplateforme"});
  couches.cadastre = L.tileLayer(wmts("CADASTRALPARCELS.PARCELLAIRE_EXPRESS","image/png"),{maxZoom:20,maxNativeZoom:19,opacity:.85});
  couches.rpg = L.tileLayer.wms(`${IGN}/wms-r/wms`,{layers:DB.settings.rpgLayer,format:"image/png",transparent:true,version:"1.3.0",opacity:.5});

  couches.ortho.addTo(map);
  couches.cadastre.addTo(map);

  L.control.layers(
    {"Photo aérienne":couches.ortho, "Plan IGN":couches.plan},

  ).addTo(map);

  coucheParcelles = L.layerGroup().addTo(map);

  const ctl = L.control({position:"topleft"});
  ctl.onAdd = ()=>{
    const d = L.DomUtil.create("div","legend");
    d.innerHTML = `<label style="margin:0 0 3px">Colorer par</label>
      <select id="colorMode" style="padding:2px 4px;font-size:11px">

  };

  legende = L.control({position:"bottomleft"});
  legende.onAdd = ()=>{ const d = L.DomUtil.create("div","legend"); d.id="legendBox"; return d; };

  map.on("click", e=>{
    if(modeAjout){ ajoutAuClic(e.latlng); return; }

    $("#left").classList.remove("open"); $("#right").classList.remove("open");

/* définitions SVG des panachages, référencées par url(#…) */
function majMotifs(){
  const svg = $("#motifs");
  if(!svg) return;
  svg.innerHTML = "<defs>" + (DB.projets||[]).map(pr=>{
    const m = MOTIFS[pr.motif] || MOTIFS.hachures;
    return m.svg("mot_" + pr.id, pr.couleur);
  }).join("") + "</defs>";
}

function dessineParcelles(){
  coucheParcelles.clearLayers();
  const vis = visibles();
  const bounds = [];

  /* fond coloré */
  for(const p of vis){
    const g = GEO[p.id]; if(!g) continue;
    const c = couleurDe(p);
    const choisie = selection.has(p.id);
    const poly = L.geoJSON({type:"Feature",geometry:g},{
      style:{ color: choisie ? "#111" : c, weight: choisie ? (p.id===sel?4:3) : 1.4,
              fillColor:c, fillOpacity: choisie ? .58 : .42, opacity:.95,
              dashArray: (choisie && p.id!==sel) ? "6 3" : null }
    });
    poly.on("click", e=>{
      L.DomEvent.stopPropagation(e);
      const oe = e.originalEvent || {};
      selectionne(p.id, oe.ctrlKey || oe.metaKey || modeMulti, oe.shiftKey);
    });
    poly.bindTooltip(`${p.section} ${p.numero}`,{permanent:true,direction:"center",className:"plabel",opacity:1});
    poly.addTo(coucheParcelles);
    bounds.push(poly.getBounds());
  }

  /* panachages par-dessus, jusqu'à deux par parcelle */
  for(const p of vis){
    const g = GEO[p.id]; if(!g || !(p.projets||[]).length) continue;
    for(const idPr of p.projets.slice(0,2)){
      if(!projet(idPr)) continue;
      const pat = L.geoJSON({type:"Feature",geometry:g},{style:{stroke:false, fillOpacity:1, interactive:false}});
      pat.addTo(coucheParcelles);
      pat.eachLayer(l=>{
        if(l._path){
          l._path.setAttribute("fill", `url(#mot_${idPr})`);
          l._path.setAttribute("fill-opacity", "0.85");
          l._path.style.pointerEvents = "none";
        }
      });
    }
  }

  const box = $("#legendBox");
  if(box){
    const {base, proj} = legendeItems();
    box.innerHTML = base.map(x=>`<div><i style="background:${x.c}"></i>${esc(x.l)}</div>`).join("")
      + (proj.length ? `<div style="border-top:1px solid var(--rule);margin:4px 0 2px"></div>` +
          proj.map(x=>`<div><i style="background:${x.c};opacity:.75"></i>${esc(x.l)}</div>`).join("") : "");
  }
  return bounds;
}

function cadreTout(){
  const b = dessineParcelles();
  if(b.length){
    let all = b[0];
    for(const x of b) all = all.extend(x);
    map.fitBounds(all,{padding:[30,30]});
  }
}

function centreSur(id){
  const g = GEO[id]; if(!g || !map) return;
  const b = L.geoJSON({type:"Feature",geometry:g}).getBounds();
  if(map.getZoom() < 15 || !map.getBounds().contains(b)) map.fitBounds(b,{padding:[60,60], maxZoom:18});
  else map.panTo(b.getCenter());
}

/* ------------------------------------------------------------------ *
 * Sélection
 * ------------------------------------------------------------------ */

function selectionne(id, additif, plage){
  const vis = visibles().map(p=>p.id);
  if(plage && ancre && vis.includes(ancre) && vis.includes(id)){
    const a = vis.indexOf(ancre), b = vis.indexOf(id);
    for(const x of vis.slice(Math.min(a,b), Math.max(a,b)+1)) selection.add(x);
    sel = id;
  } else if(additif){
    if(selection.has(id)){
      selection.delete(id);
      if(sel === id) sel = [...selection].pop() || null;
    } else { selection.add(id); sel = id; }
    ancre = id;
  } else {
    selection = new Set([id]); sel = id; ancre = id;
    centreSur(id);
  }
  render();
  if(window.innerWidth <= 860 && !additif){ $("#right").classList.remove("replie"); $("#right").classList.add("open"); $("#left").classList.remove("open"); }
}

function parcellesSelectionnees(){
  return [...selection].map(parcelle).filter(Boolean);
}

function visibles(){
  const q = ($("#q").value||"").trim();
  const fc = $("#fCommune").value, fs = $("#fStatut").value;
  return DB.parcelles.filter(p=>{
    if(p.actif === false) return false;
    if(fc && p.insee !== fc) return false;
    if(fs && statutDe(p) !== fs) return false;
    return correspond(p, q);
  }).sort((a,b)=> a.id.localeCompare(b.id));
}

function renderList(){
  const l = $("#list");
  if(tab === "baux"){
    const items = DB.baux.map(b=>{

      return `<div class="item" data-bail="${b.id}">

        <span class="ar">${ha(s)}</span></div>`;

    l.innerHTML = items || `<div class="note" style="padding:14px">Aucun bail. Un bail regroupe les parcelles d'un même propriétaire, avec sa date d'effet et son échéance.</div>`;
    l.querySelectorAll("[data-bail]").forEach(n=> n.onclick = ()=> editBail(n.dataset.bail));
    return;

  const vis = visibles();
  l.innerHTML = vis.map(p=>{
    const c = couleurDe(p);
    const cb = modeMulti ? `<input type="checkbox" data-cb="${p.id}" ${selection.has(p.id)?"checked":""}>` : "";
    const pr = (p.projets||[]).map(id=>{ const x = projet(id); return x?`<span style="color:${x.couleur}">•</span>`:""; }).join("");
    return `<div class="item ${selection.has(p.id)?"sel":""} ${p.id===sel?"primaire":""}" data-p="${p.id}">
      ${cb}<span class="sw" style="background:${c}"></span>

      <div class="sub">${esc(p.lieuDit||communeNom(p.insee))}${GEO[p.id]?"":" · sans contour"}</div></span>
      <span class="ar">${ha(contenance(p))}</span></div>`;
  }).join("");
  if(!vis.length) l.innerHTML = `<div class="note" style="padding:14px">${($("#q").value||"").trim()
    ? "Aucune parcelle ne correspond à cette recherche."
    : "Aucune parcelle. Commence par « Importer » un relevé parcellaire MSA, ou ajoute une parcelle au clic sur la carte."}</div>`;

  l.querySelectorAll("[data-p]").forEach(n=>{
    n.onclick = e=>{
      if(e.target.dataset.cb !== undefined) return;
      selectionne(n.dataset.p, e.ctrlKey || e.metaKey || modeMulti, e.shiftKey);
    };
  });
  l.querySelectorAll("[data-cb]").forEach(n=>{
    n.onclick = e=>{
      e.stopPropagation();
      selectionne(n.dataset.cb, true, false);
    };
  });
}

function ajoutManuel(){
  const s = prompt("Section et numéro (ex. A 145) :"); if(!s) return;
  const m = s.trim().toUpperCase().match(/^([A-Z]{1,2})\s*(\d{1,4})$/);
  if(!m) return toast("Format attendu : une ou deux lettres, puis le numéro","bad");
  const insee = $("#fCommune").value || (DB.communes[0] && DB.communes[0].insee);
  if(!insee) return toast("Ajoute d'abord une commune dans les paramètres","bad");
  const id = idParcelle(insee,"000",m[1],m[2]);
  if(parcelle(id)){ selectionne(id); return toast("Cette parcelle est déjà dans la liste"); }
  DB.parcelles.push(creeParcelle({id, insee, section:pad(m[1],2), numero:pad(m[2],4)}));
  touche(); selectionne(id); recupereContours([parcelle(id)], true);
}

function creeParcelle(o){
  return Object.assign({
    id:"", insee:"", prefixe:"000", section:"", numero:"",
    lieuDit:"", contenance:0, contenanceCalc:null, natures:[], projets:[],
    statut:"inconnu", bailId:null, proprietaireId:null, actif:true, notes:"", tags:[]
  }, o);
}

/* Interroge le cadastre sur un petit carré autour du point cliqué */
async function ajoutAuClic(latlng){
  const d = 0.00004;                       // environ 4 m
  const {lat, lng} = latlng;
  const geom = {type:"Polygon",coordinates:[[
    [lng-d,lat-d],[lng+d,lat-d],[lng+d,lat+d],[lng-d,lat+d],[lng-d,lat-d]]]};
  toast("Interrogation du cadastre…");
  let f = null;
  try{
    const r = await fetch(`${APICARTO}?geom=${encodeURIComponent(JSON.stringify(geom))}&source_ign=PCI`);
    if(r.ok){
      const j = await r.json();
      if(j && j.features && j.features.length) f = j.features[0];
    }
  }catch(err){ return toast("Cadastre injoignable","bad"); }
  if(!f) return toast("Aucune parcelle cadastrale à cet endroit","bad");

  const pr = f.properties || {};
  let insee, prefixe, section, numero;
  if(pr.idu && String(pr.idu).length === 14){
    const idu = String(pr.idu);
    insee = idu.slice(0,5); prefixe = idu.slice(5,8);
    section = idu.slice(8,10); numero = idu.slice(10,14);
  } else {
    insee = pr.code_insee || ((pr.code_dep||"") + (pr.code_com||""));
    prefixe = pr.com_abs || "000";
    section = pad(pr.section,2); numero = pad(pr.numero,4);
  }
  if(!insee || !section || !numero) return toast("Réponse du cadastre incomplète","bad");

  const id = idParcelle(insee, prefixe, section, numero);
  if(parcelle(id)){ selectionne(id); return toast("Cette parcelle est déjà dans la liste"); }

  if(!DB.communes.find(c=>c.insee===insee)){
    let nom = pr.nom_com || "";
    if(!nom){
      try{
        const rc = await fetch(`${GEOAPI}/${insee}?fields=nom`);
        if(rc.ok) nom = (await rc.json()).nom || "";
      }catch(e){ /* sans importance */ }
    }
    DB.communes.push({insee, nom: nom || insee});
    rafraichitFiltres();
  }

  const p = creeParcelle({id, insee, prefixe, section, numero,
    contenance: Number(pr.contenance) || 0});
  if(f.geometry){ GEO[id] = f.geometry; p.contenanceCalc = Math.round(aireGeo(f.geometry)); }
  if(!p.contenance) p.contenance = p.contenanceCalc || 0;
  DB.parcelles.push(p);
  touche();
  selection = new Set([id]); sel = id; ancre = id;
  render();
  toast(`${section.replace(/^0+/,"")} ${numero} ajoutée — ${haca(contenance(p))}`);
}

/* ------------------------------------------------------------------ *
 * API Carto — contours et contenances officielles
 * ------------------------------------------------------------------ */

const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function apiCarto(insee, section, numero){
  const essais = [
    {section:pad(section,2), numero:pad(numero,4)},
    {section:String(section).replace(/^0+/,""), numero:String(Number(numero))}
  ];
  for(const e of essais){
    const url = `${APICARTO}?code_insee=${encodeURIComponent(insee)}&section=${encodeURIComponent(e.section)}&numero=${encodeURIComponent(e.numero)}&source_ign=PCI`;
    try{
      const r = await fetch(url);
      if(!r.ok) continue;
      const j = await r.json();
      if(j && j.features && j.features.length) return j.features[0];
    }catch(err){ /* réseau : on tente la variante suivante */ }
    await sleep(120);
  }
  return null;
}

/* Aire géodésique (sphère), en m² — contrôle de cohérence uniquement */
function aireGeo(geom){
  const R = 6378137, rad = d => d*Math.PI/180;
  const anneau = co=>{
    const n = co.length; if(n<3) return 0;
    let t = 0;
    for(let i=0;i<n;i++){
      const a = co[(i-1+n)%n], b = co[i], c = co[(i+1)%n];
      t += (rad(c[0]) - rad(a[0])) * Math.sin(rad(b[1]));
    }
    return Math.abs(t*R*R/2);
  };
  const poly = rings => rings.reduce((s,r,i)=> s + (i===0?anneau(r):-anneau(r)), 0);
  if(geom.type==="Polygon") return poly(geom.coordinates);
  if(geom.type==="MultiPolygon") return geom.coordinates.reduce((s,p)=>s+poly(p),0);
  return 0;
}

async function recupereContours(liste, forcer){
  const cibles = liste || DB.parcelles.filter(p=>p.actif!==false && (!GEO[p.id] || !contenance(p)));
  if(!cibles.length) return toast("Tous les contours et contenances sont à jour");
  const btn = $("#btnFetchGeo"); const ancien = btn.textContent;
  let ok = 0; const ko = [];
  for(let i=0;i<cibles.length;i++){
    const p = cibles[i];
    if(!forcer && GEO[p.id] && contenance(p)) continue;
    btn.textContent = `Cadastre ${i+1}/${cibles.length}…`;
    const f = await apiCarto(p.insee, p.section, p.numero);
    if(f && f.geometry){
      GEO[p.id] = f.geometry;
      p.contenanceCalc = Math.round(aireGeo(f.geometry));
      const c = f.properties && f.properties.contenance;
      if(c) p.contenance = Number(c);
      else if(!contenance(p)) p.contenance = p.contenanceCalc;
      ok++;
      if(ok % 5 === 0){ dessineParcelles(); renderStats(); }
    } else ko.push(p.section+" "+p.numero);
    await sleep(280);
  }
  btn.textContent = ancien;
  touche(); render();
  if(ok && !liste) cadreTout();
  toast(`${ok} parcelle${ok>1?"s":""} complétée${ok>1?"s":""} depuis le cadastre${ko.length?" — introuvables : "+ko.join(", "):""}`, ko.length>0);
}

let pdfjsPret = null;
function chargePdfJs(){
  if(pdfjsPret) return pdfjsPret;
  pdfjsPret = new Promise((res,rej)=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      res(window.pdfjsLib);
    };
    s.onerror = ()=> rej(new Error("PDF.js n'a pas pu être chargé"));
    document.head.appendChild(s);
  });
  return pdfjsPret;
}

async function litReleve(file){
  const pdfjsLib = await chargePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const lignes = [];
  let totalReleve = null, communeNomTrouvee = null;

  for(let np=1; np<=pdf.numPages; np++){
    const page = await pdf.getPage(np);
    const tc = await page.getTextContent();
    const items = tc.items
      .map(it=>({ s:(it.str||"").trim(), x:it.transform[4], y:it.transform[5],
                  vert: Math.abs(it.transform[1]) > Math.abs(it.transform[0]) }))
      .filter(it=> it.s.length);

    const anc = {};
    for(const it of items){
      if(it.vert) continue;
      if(it.s === "Ha" && anc.ha == null) anc.ha = it.x;
      else if(it.s === "PLAN" && anc.plan == null) anc.plan = it.x;
      else if(/^LIEU-DIT/.test(it.s) && anc.lieu == null) anc.lieu = it.x;
    }

    const parY = new Map();
    for(const it of items){
      const k = Math.round(it.y/2)*2;
      if(!parY.has(k)) parY.set(k,[]);
      parY.get(k).push(it);
    }
    for(const y of [...parY.keys()].sort((a,b)=>b-a)){
      const row = parY.get(y).sort((a,b)=>a.x-b.x);
      const txt = row.map(r=>r.s).join(" ");
      const mc = txt.match(/TOTAL COMMUNE DE\s+([A-ZÀ-Ü' -]+)/i);
      if(mc) communeNomTrouvee = mc[1].trim();
      if(/TOTAL/i.test(txt)){
        const nums = row.filter(r=> anc.ha!=null && r.x >= anc.ha-8 && /^\d{1,3}$/.test(r.s)).map(r=>+r.s);
        if(nums.length>=3) totalReleve = nums[0]*10000 + nums[1]*100 + nums[2];
        continue;
      }
      lignes.push({row, anc, txt});
    }
  }
  return {lignes, totalReleve, communeNomTrouvee};
}

function analyseLignes(res){
  const out = [];
  let dept = "", com = "", compte = "";

  for(const L of res.lignes){
    const {row, anc} = L;

    const mBloc = L.txt.match(/^\s*(\d{2,3})\s+(\d{3})\s+([A-Z])?\s*(\d{5})/);
    if(mBloc){ dept = mBloc[1]; com = mBloc[2]; compte = mBloc[4]; }

    let iSec = -1;
    for(let i=0;i<row.length;i++){
      if(anc.plan!=null && row[i].x > anc.plan-4) break;
      if(/^[A-Z]{1,2}$/.test(row[i].s) && !/^[DFM]$/.test(row[i].s)) iSec = i;
    }
    if(iSec < 0) continue;

    const iNum = row.findIndex((r,i)=> i>iSec && /^\d{3,4}$/.test(r.s) && (anc.plan==null || Math.abs(r.x-anc.plan) < 40));
    if(iNum < 0) continue;

    const section = row[iSec].s, numero = pad(row[iNum].s,4);

    let sub = "", nature = "";
    for(let i=iNum+1;i<row.length;i++){
      if(anc.ha!=null && row[i].x >= anc.ha-8) break;
      const m = row[i].s.match(/^(\d{2})\s*([A-Z]{1,2})?$/);
      if(m){ sub = m[1]; if(m[2]) nature = m[2]; continue; }
      if(/^[A-Z]{1,2}$/.test(row[i].s)) nature = row[i].s;
    }

    let fv = "";
    for(const r of row) if(/^[DFM]$/.test(r.s) && anc.ha!=null && r.x > anc.ha + 40) fv = r.s;

    let lieu = "";
    if(anc.lieu != null){
      lieu = row.filter(r=> r.x >= anc.lieu-30).map(r=>r.s).join(" ").trim();
      if(/^\d+$/.test(lieu)) lieu = "";
    }

    out.push({
      garder:true, dept, com, compte, section, numero, sub, nature, fv, lieu,
      insee: dept && com ? pad(dept,2)+pad(com,3) : ""
    });
  }
  return out;
}

function appliqueImport(rows, communeTrouvee){
  let nP = 0, nB = 0;
  const comptes = new Map();
  const nouvelles = [];

  for(const r of rows){
    if(!r.insee || !r.section || !r.numero) continue;
    if(!DB.communes.find(c=>c.insee===r.insee))
      DB.communes.push({insee:r.insee, nom: communeTrouvee || r.insee});

    const id = idParcelle(r.insee,"000",r.section,r.numero);
    let p = parcelle(id);
    if(!p){
      p = creeParcelle({id, insee:r.insee, section:pad(r.section,2), numero:pad(r.numero,4)});
      DB.parcelles.push(p); nouvelles.push(p); nP++;
    }
    if(r.nature && !(p.natures||[]).includes(r.nature)) (p.natures = p.natures||[]).push(r.nature);
    if(r.lieu && !/[A-Z]{4,}\s+[A-Z]{4,}/.test(r.lieu) && !p.lieuDit) p.lieuDit = r.lieu;

    if(r.fv && p.statut === "inconnu") p.statut = FV_STATUT[r.fv] || "inconnu";

    if(r.compte && r.fv && r.fv !== "D"){
      if(!comptes.has(r.compte)){
        let pr = DB.proprietaires.find(x=>x.compte===r.compte);
        if(!pr){
          pr = {id:uid("pr_"), compte:r.compte, nom:"Compte "+r.compte, adresse:"", tel:"", notes:""};
          DB.proprietaires.push(pr);
        }
        let b = DB.baux.find(x=>x.proprietaireId===pr.id);
        if(!b){
          b = {id:uid("b_"), proprietaireId:pr.id, statut:FV_STATUT[r.fv]||"fermage",
               dateEffet:"", dureeAns:9, echeance:null, fermageAnnuel:null, notes:""};
          DB.baux.push(b); nB++;
        }
        comptes.set(r.compte, b.id);
      }
      if(!p.bailId) p.bailId = comptes.get(r.compte);
    }
  }
  touche(); rafraichitFiltres(); render();
  toast(`${nP} parcelle${nP>1?"s":""} et ${nB} bail/baux créés. Récupération des surfaces au cadastre…`);
  if(nouvelles.length) recupereContours(nouvelles, true);
}

function telecharge(nom, blob){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nom;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function nomProjets(p){
  return (p.projets||[]).map(id=>{ const x = projet(id); return x?x.nom:""; }).filter(Boolean).join(", ");
}

function lignesExport(){
  return DB.parcelles.filter(p=>p.actif!==false).sort((a,b)=>a.id.localeCompare(b.id)).map(p=>{
    const b = p.bailId ? bail(p.bailId) : null;

      "Identifiant": p.id,

function exportCSV(){

    s.onload = ()=> res(window.XLSX);
    s.onerror = ()=> rej(new Error("SheetJS n'a pas pu être chargé"));

async function exportXLSX(){
  const rows = lignesExport();
  if(!rows.length) return toast("Rien à exporter","bad");
  let XLSX;
  try{ XLSX = await chargeSheetJS(); }
  catch(e){ return toast("Export tableur indisponible hors ligne — utilise le CSV","bad"); }

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  const ref = XLSX.utils.decode_range(ws["!ref"]);
  const texte = ["Identifiant","Section","Numéro"];
  const entetes = Object.keys(rows[0]);
  for(let c=ref.s.c;c<=ref.e.c;c++){
    if(!texte.includes(entetes[c])) continue;
    for(let r=ref.s.r+1;r<=ref.e.r;r++){
      const a = XLSX.utils.encode_cell({r,c});
      if(ws[a]){ ws[a].t = "s"; ws[a].v = String(ws[a].v); ws[a].z = "@"; }
    }
  }
  ws["!cols"] = entetes.map(h=>({wch: Math.max(10, Math.min(28, h.length+4))}));
  XLSX.utils.book_append_sheet(wb, ws, "Parcelles");

  const bx = DB.baux.map(b=>{
    const pr = proprio(b.proprietaireId);
    const ps = DB.parcelles.filter(p=>p.bailId===b.id);
    return {
      "Bailleur": pr?pr.nom:"", "Adresse": pr?pr.adresse:"", "Téléphone": pr?pr.tel:"",
      "Statut": STATUTS[b.statut]?STATUTS[b.statut].l:b.statut,
      "Date d'effet": b.dateEffet||"", "Durée (ans)": b.dureeAns||"",
      "Échéance": b.echeance||"", "Fermage annuel (€)": b.fermageAnnuel!=null?b.fermageAnnuel:"",
      "Parcelles": ps.length, "Surface (ha)": +(ps.reduce((s,p)=>s+contenance(p),0)/10000).toFixed(4),
      "Notes": b.notes||""
    };
  });
  if(bx.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bx), "Baux");

  const agr = fn=>{
    const m = new Map();
    for(const p of DB.parcelles.filter(p=>p.actif!==false)){
      const k = fn(p); m.set(k, (m.get(k)||0) + contenance(p));
    }
    return [...m.entries()].sort((a,b)=>b[1]-a[1]);
  };
  const synth = [];
  const bloc = (titre, fn)=>{
    synth.push({Regroupement:titre, Clé:"", "Surface (ha)":""});
    fn().forEach(([k,v])=> synth.push({Regroupement:"", Clé:k, "Surface (ha)":+(v/10000).toFixed(4)}));
    synth.push({Regroupement:"", Clé:"", "Surface (ha)":""});
  };
  bloc("Par statut", ()=> agr(p=>STATUTS[statutDe(p)]?STATUTS[statutDe(p)].l:statutDe(p)));
  bloc("Par bailleur", ()=> agr(bailleurDe));
  bloc("Par nature", ()=> agr(naturesLabel));
  bloc("Par commune", ()=> agr(p=>communeNom(p.insee)));
  if((DB.projets||[]).length) bloc("Par projet", ()=> agr(p=> nomProjets(p) || "hors projet"));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(synth), "Synthèse");

  XLSX.writeFile(wb, `foncier-${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ------------------------------------------------------------------ *
 * Google Drive
 * ------------------------------------------------------------------ */

let token = null, tokenClient = null, dossierId = null, syncTimer = null;

function chargeGis(){
  if(window.google && google.accounts) return Promise.resolve();
  return new Promise((res,rej)=>{
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = res; s.onerror = ()=> rej(new Error("Google Identity indisponible"));
    document.head.appendChild(s);
  });
}

async function connecteDrive(interactif){
  const cid = clientId();
  if(!cid){ toast("Renseigne un identifiant client Google dans les paramètres","bad"); return false; }
  await chargeGis();
  return new Promise(res=>{
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cid, scope: SCOPE,
      callback: t=>{
        if(t && t.access_token){
          token = t.access_token;
          setTimeout(()=>{ token = null; majSync(); }, (t.expires_in||3600)*1000 - 60000);
          majSync(); res(true);
        } else res(false);
      },
      error_callback: ()=> res(false)
    });
    tokenClient.requestAccessToken({prompt: interactif ? "" : "none"});
  });
}

async function drive(path, opts){
  const r = await fetch("https://www.googleapis.com/drive/v3/"+path,
    Object.assign({}, opts, {headers: Object.assign({Authorization:"Bearer "+token}, (opts&&opts.headers)||{})}));
  if(r.status === 401){ token = null; majSync(); throw new Error("Session Google expirée, reconnecte-toi"); }
  if(!r.ok) throw new Error("Drive : " + r.status);
  return r.json();
}

async function dossier(nom, parent){
  const q = encodeURIComponent(`name='${nom}' and mimeType='application/vnd.google-apps.folder' and trashed=false` + (parent?` and '${parent}' in parents`:""));
  const l = await drive(`files?q=${q}&fields=files(id)`);
  if(l.files.length) return l.files[0].id;
  const meta = {name:nom, mimeType:"application/vnd.google-apps.folder"};
  if(parent) meta.parents = [parent];
  const c = await drive("files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(meta)});
  return c.id;
}

async function fichier(nom, parent){
  const q = encodeURIComponent(`name='${nom}' and '${parent}' in parents and trashed=false`);
  const l = await drive(`files?q=${q}&fields=files(id,modifiedTime)`);
  return l.files[0] || null;
}

async function ecrit(nom, parent, contenu, id){
  const meta = id ? {} : {name:nom, parents:[parent]};
  const bord = "----f" + Date.now();
  const corps =
    `--${bord}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
    `--${bord}\r\nContent-Type: application/json\r\n\r\n${contenu}\r\n--${bord}--`;
  const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files${id?"/"+id:""}?uploadType=multipart&fields=id`,{
    method: id ? "PATCH" : "POST",
    headers:{Authorization:"Bearer "+token, "Content-Type":`multipart/related; boundary=${bord}`},
    body: corps
  });
  if(!r.ok) throw new Error("Écriture Drive : " + r.status);
  return (await r.json()).id;
}

async function litFichier(id){
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{Authorization:"Bearer "+token}});
  if(!r.ok) throw new Error("Lecture Drive : " + r.status);
  return r.json();
}

async function syncDrive(silencieux){
  if(!token){ if(!await connecteDrive(!silencieux)) return; }
  try{
    majSync("synchronisation…");
    dossierId = dossierId || await dossier("Foncier");
    const sauv = await dossier("sauvegardes", dossierId);

    const fD = await fichier("foncier.json", dossierId);
    const fG = await fichier("geo-parcelles.json", dossierId);

    if(fD && !DB.parcelles.length){
      const dist = await litFichier(fD.id);
      DB = Object.assign(emptyDB(), dist);
      if(fG) GEO = await litFichier(fG.id);
      migre();
      await kvSet("db",DB); await kvSet("geo",GEO);
      rafraichitFiltres(); render(); cadreTout();
      majSync(); toast("Données récupérées depuis Drive");
      return;
    }

    DB.updatedAt = new Date().toISOString();
    await ecrit("foncier.json", dossierId, JSON.stringify(DB), fD ? fD.id : null);
    await ecrit("geo-parcelles.json", dossierId, JSON.stringify(GEO), fG ? fG.id : null);

    const stamp = new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
    await ecrit(`foncier-${stamp}.json`, sauv, JSON.stringify(DB), null);

    const anciennes = await drive(`files?q=${encodeURIComponent(`'${sauv}' in parents and trashed=false`)}&fields=files(id,name)&orderBy=name desc`);
    for(const f of anciennes.files.slice(20))
      await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}`,{method:"DELETE",headers:{Authorization:"Bearer "+token}});

    dirty = false; majSync();
    if(!silencieux) toast("Enregistré sur Drive");
  }catch(e){
    majSync("erreur");
    toast(e.message, true);
  }
}

function planifieSync(){
  if(!clientId() || !token){ majSync(); return; }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=> syncDrive(true), 4000);
  majSync();
}

function majSync(txt){
  const s = $("#syncState");
  if(txt){ s.textContent = txt; return; }
  if(!clientId()) s.textContent = "local";
  else if(!token) s.textContent = "Drive : déconnecté";
  else s.textContent = dirty ? "Drive : à enregistrer" : "Drive : à jour";
}

/* ------------------------------------------------------------------ *
 * Géolocalisation
 * ------------------------------------------------------------------ */

function dansPolygone(pt, geom){
  const test = ring=>{
    let dedans = false;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if(((yi>pt[1]) !== (yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) dedans = !dedans;
    }
    return dedans;
  };
  const poly = rings=>{
    if(!test(rings[0])) return false;
    for(let i=1;i<rings.length;i++) if(test(rings[i])) return false;
    return true;
  };
  if(geom.type === "Polygon") return poly(geom.coordinates);
  if(geom.type === "MultiPolygon") return geom.coordinates.some(poly);
  return false;
}

function ouSuisJe(){
  if(!navigator.geolocation) return toast("Géolocalisation indisponible","bad");
  toast("Localisation en cours…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const pt = [pos.coords.longitude, pos.coords.latitude];
    if(marqueurPos) map.removeLayer(marqueurPos);
    marqueurPos = L.circleMarker([pt[1],pt[0]],{radius:7,color:"#111",weight:2,fillColor:"#fff",fillOpacity:1}).addTo(map);
    map.setView([pt[1],pt[0]], Math.max(map.getZoom(),17));
    const trouvee = DB.parcelles.find(p=> GEO[p.id] && dansPolygone(pt, GEO[p.id]));
    if(trouvee){ selectionne(trouvee.id); toast(`Tu es sur ${trouvee.section} ${trouvee.numero}${trouvee.lieuDit?" — "+trouvee.lieuDit:""}`); }
    else toast("Aucune de tes parcelles à cet endroit");
  }, err=> toast("Position indisponible : "+err.message, true), {enableHighAccuracy:true, timeout:12000});
}

/* Reprise des données antérieures */
function migre(){
  let fait = false;
  if(!DB.projets) DB.projets = [];
  for(const p of DB.parcelles){
    if(p.subdivisions && !p.natures){
      p.natures = [...new Set(p.subdivisions.map(d=>d.nature).filter(Boolean))];
      delete p.subdivisions;
      delete p.revenuCadastral;
      p.contenance = 0;
      fait = true;
    }
    if(!p.natures) p.natures = [];
    if(!p.projets) p.projets = [];
  }
  return fait;
}

    if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if(e.key === "Escape"){
      if(modeAjout) $("#btnAjout").click();
      else if(selection.size){ selection.clear(); sel = null; render(); }
    }
    if((e.ctrlKey||e.metaKey) && e.key === "a"){
      e.preventDefault();
      const vis = visibles();
      selection = new Set(vis.map(p=>p.id)); sel = vis.length?vis[0].id:null; render();
    }
  });

  window.addEventListener("beforeunload", e=>{
    if(dirty && token){ e.preventDefault(); e.returnValue = ""; }
  });
}

demarre();
</script>
